services:
  storage-init:
    image: alpine:3.21
    user: "0:0"
    restart: "no"
    command: >-
      sh -c '
        mkdir -p /downloads /config &&
        chown -R 65534:65534 /downloads /config &&
        chmod -R u+rwX,g+rwX,o+rX /downloads /config
      '
    volumes:
      - ztorrent-downloads:/downloads
      - aria2-config:/config

  aria2:
    image: p3terx/aria2-pro:latest
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
    environment:
      PUID: "65534"
      PGID: "65534"
      RPC_SECRET: ${ARIA2_RPC_SECRET:?set ARIA2_RPC_SECRET}
      RPC_PORT: 6800
      LISTEN_PORT: 6888
      DISK_CACHE: ${ARIA2_DISK_CACHE:-512M}
      IPV6_MODE: ${ARIA2_IPV6_MODE:-false}
      UMASK_SET: "022"
    volumes:
      - ztorrent-downloads:/downloads
      - aria2-config:/config
    ports:
      - "6888:6888/tcp"
      - "6888:6888/udp"

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      aria2:
        condition: service_started
    environment:
      ARIA2_RPC_URL: http://aria2:6800/jsonrpc
      ARIA2_RPC_SECRET: ${ARIA2_RPC_SECRET:?set ARIA2_RPC_SECRET}
      DOWNLOAD_DIR: /downloads
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://matthewcodergamer.github.io}
      ARIA2_HTTP_CONNECTIONS: ${ARIA2_HTTP_CONNECTIONS:-16}
      ARIA2_SPLIT: ${ARIA2_SPLIT:-16}
      ARIA2_MIN_SPLIT_SIZE: ${ARIA2_MIN_SPLIT_SIZE:-1M}
      ARIA2_BT_MAX_PEERS: ${ARIA2_BT_MAX_PEERS:-200}
      ARIA2_FILE_ALLOCATION: ${ARIA2_FILE_ALLOCATION:-none}
      ARIA2_MAX_CONCURRENT_DOWNLOADS: ${ARIA2_MAX_CONCURRENT_DOWNLOADS:-8}
      ARIA2_MAX_OVERALL_UPLOAD_LIMIT: ${ARIA2_MAX_OVERALL_UPLOAD_LIMIT:-2M}
      ARIA2_BT_UPLOAD_LIMIT: ${ARIA2_BT_UPLOAD_LIMIT:-2M}
    volumes:
      - ztorrent-downloads:/downloads
    expose:
      - "8080"

  telemetry:
    build: ./telemetry
    restart: unless-stopped
    expose:
      - "8090"

  gateway:
    build:
      context: .
      dockerfile: deploy/codespaces-gateway.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
      - telemetry
    ports:
      - "8080:8080"

volumes:
  ztorrent-downloads:
  aria2-config:
